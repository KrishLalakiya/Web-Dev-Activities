<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox Layout</title>
    <style>
        .container {
            height: 1000px;
            width: 1200px;
            border: 4px solid rgb(255, 72, 0);
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-column-gap: 10px;
            grid-row-gap: -50px;
        }

        .container>div {
            border-radius: 5px;
        }

        .child1 {
            grid-column: 1/4;
            border: 4px solid purple;
            transform: translateY(4px);
            z-index: -2;
        }

        .child2 {
            grid-row: 2/4;
            border: 5px solid rgb(0, 149, 0);
            z-index: 2;
        }

        .child4 {
            grid-row: 2/4;
            grid-column: 3/4;
            border: 4px solid rgb(128, 0, 255);
        }

        .child {
            border: 4px solid rgb(0, 34, 255);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="child1">1</div>
        <div class="child2">2</div>
        <div class="child">3</div>
        <div class="child4">4</div>
        <div class="child">5</div>

    </div>
</body>

</html>
