<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            margin: auto;
        }

        .square {
            background-color: blue;
            width: 150px;
            height: 150px;
            margin: auto;
            margin-bottom: 50px;
        }

        .rectangle {
            background-color: green;
            width: 300px;
            height: 150px;
            margin: auto;
            margin-bottom: 50px;
        }

        .circle {
            height: 150px;
            width: 150px;
            background-color: red;
            border-radius: 50%;
            margin: auto;
            margin-bottom: 50px;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 100px solid purple;
            margin: auto;
            margin-bottom: 50px;
        }

        .diamond {
            background-color: rgb(0, 89, 255);
            width: 150px;
            height: 150px;
            transform: rotate(45deg);
            margin: auto;
            margin-bottom: 50px;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="square"></div>
        <div class="rectangle"></div>
        <div class="circle"></div>
        <div class="triangle"></div>
        <div class="diamond"></div>
    </div>
</body>

</html>
