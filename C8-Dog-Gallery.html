<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog-Gallery</title>


    <style>
        body {
            margin: 0;
            background-color: #f0f0f0;
            padding: 20px;
        }

        .container {
            display: grid;
            gap: 15px;
            grid-template-columns: repeat(3, 1fr);
        }

        .box {
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            border: 2px solid transparent;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .box:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            border: 2px solid black;
        }

        h1 {
            text-align: center;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <h1 style="font-size:50px;">Dogs</h1>
    <div class="container">
        <div class="box" id="box1">
            <img
                src="https://hips.hearstapps.com/hmg-prod/images/dog-puppy-on-garden-royalty-free-image-1586966191.jpg?crop=0.752xw:1.00xh;0.175xw,0&resize=1200:*" />
        </div>
        <div class="box" id="box2">
            <img
                src="https://images.squarespace-cdn.com/content/v1/54822a56e4b0b30bd821480c/51fe71a3-cb12-4ac2-882f-45955401dd53/Golden+Retrievers+dans+pet+care.jpeg?format=2500w">
        </div>
        <div class="box" id="box3">
            <img src="https://www.carecredit.com/sites/cc/image/german_shepherd_dog_guide.jpg">
        </div>
        <div class="box" id="box4">
            <img
                src="https://images.squarespace-cdn.com/content/v1/54822a56e4b0b30bd821480c/1f84c55a-7d8e-4edd-9b80-16cc624b5af9/poodles+dans+pet+care.jpeg?format=2500w">
        </div>
        <div class="box" id="box5">
            <img
                src="https://images.squarespace-cdn.com/content/v1/54822a56e4b0b30bd821480c/8e2ec48b-272e-4f22-b4c6-d6de1ea04b41/Chihuahuas+dans+pet+care.jpeg?format=2500w">
        </div>
        <div class="box" id="box6">
            <img
                src="https://images.squarespace-cdn.com/content/v1/54822a56e4b0b30bd821480c/3301bd0c-1eb1-4c7e-8339-7f4837bd9c99/beagles+dans+pet+care.jpeg?format=2500w">
        </div>
        <div class="box" id="box7">
            <img
                src="https://images.squarespace-cdn.com/content/v1/54822a56e4b0b30bd821480c/114cfb62-2975-484f-897b-6c8072408a43/corgis+dans+pet+care.jpeg?format=2500w">
        </div>
        <div class="box" id="box8">
            <img
                src="https://images.squarespace-cdn.com/content/v1/54822a56e4b0b30bd821480c/018cbb5c-5217-425e-8819-c935e58bdf61/siberian+huskies+dans+pet+care.jpg?format=2500w">
        </div>
        <div class="box" id="box9">
            <img
                src="https://images.squarespace-cdn.com/content/v1/54822a56e4b0b30bd821480c/2afb96fb-7ce9-4283-810f-6e41996e2ee4/bernese+mountain+dog+dans+pet+care.jpeg?format=2500w">
        </div>
    </div>
</body>

</html>
